name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # lastUpdated: true 的"最后更新于"取自 git 历史。默认浅克隆只有 1 个提交，
        # 会让每个文件的最后修改时间都塌成 checkout 那一次提交，整站日期变成构建日。
        with:
          fetch-depth: 0

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与本地及发布流程共用：配置、astro check、build、源文件与产物静态检查。
      - name: Verify
        run: pnpm run verify
