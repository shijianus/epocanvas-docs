name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Type check (astro check)
        run: pnpm exec astro check

      - name: i18n content audit
        run: node scripts/audit-i18n.mjs

      - name: Anchor link check
        run: node scripts/check-anchors.mjs

      - name: Image sanity check
        run: node scripts/check-images.mjs

      - name: Localized image reference check
        run: node scripts/check-localized-images.mjs
