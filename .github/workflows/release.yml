name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify tag, package version and main ancestry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs --tag

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Verify release snapshot
        run: pnpm run verify:release
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Release metadata
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { releaseMetadata } from './scripts/verify-release.mjs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const { prerelease } = releaseMetadata(process.env.TAG_NAME, pkg.version);
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${prerelease}\n`);
          NODE

  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100")"
          id="$(printf '%s' "${releases}" | jq -sr --arg tag "${TAG_NAME}" 'add // [] | map(select(.tag_name == $tag)) | .[0].id // empty')"
          latest=legacy
          if [[ "${PRERELEASE}" == true ]]; then
            latest=false
          fi
          payload="$(mktemp)"
          trap 'rm -f "${payload}"' EXIT
          jq -n --arg tag "${TAG_NAME}" --arg latest "${latest}" \
            --argjson prerelease "${PRERELEASE}" --rawfile notes RELEASE_NOTES.md \
            '{tag_name:$tag, name:("EpoCanvas Docs " + $tag), body:$notes, draft:false, prerelease:$prerelease, make_latest:$latest}' > "${payload}"
          if [[ -n "${id}" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/releases/${id}" --input "${payload}"
          else
            gh api --method POST "repos/${GH_REPO}/releases" --input "${payload}"
          fi
