name: Release

on:
  push:
    tags:
      - 'v*'   # 推送以 v 开头的标签时自动触发

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 标签名必须经环境变量传入，不能写成 "${{ github.ref_name }}"：
          # 那是构建期文本替换，标签名里带引号或分号即可注入并执行任意 shell。
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Publishing release for tag: ${TAG_NAME}"
          # 只接受规范 semver 形式的标签（vX.Y.Z，可带 -预发布）。
          # 这里必须是严格的正则而不是 case 的 glob：glob 写法 v[0-9]*.[0-9]*.[0-9]*
          # 会把 v1.3.1"; … 这类带任意尾缀的输入也判为合法（[0-9]* 允许后接任意字符）。
          if ! printf '%s' "${TAG_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "标签名 ${TAG_NAME} 不符合 vX.Y.Z[-prerelease] 规范，拒绝发布" >&2
            exit 1
          fi
          # 同名 release 已存在时（例如重新推送 tag，或 tag 删除后旧 release 转为草稿）先删掉，再按当前 RELEASE_NOTES.md 重新发布
          gh release delete "${TAG_NAME}" --yes 2>/dev/null || true
          gh release create "${TAG_NAME}" \
            --title "EpoCanvas Docs ${TAG_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --latest
