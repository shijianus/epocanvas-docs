<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%" fill="none">
  <defs>
    <filter id="rShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">EpoMail 三层智能规则瀑布流引擎 (Waterfall Rule Engine Architecture)</text>
  <text x="40" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#64748b">严密保障用户意志第一优先级，防止系统启发式分类造成的越权误伤与误判</text>

  <!-- Level 1 Card -->
  <g transform="translate(40, 80)">
    <rect width="840" height="80" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#rShadow)"/>
    <rect width="120" height="80" rx="10" fill="#fef2f2"/>
    <path d="M120 0 v80" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Level 1</text>
    <text x="20" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">绝对意志层</text>

    <text x="145" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">信任白名单 &amp; 拒信黑名单 (Trust Whitelist / Global Blacklist)</text>
    <text x="145" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">最高执行权重。一旦命中白名单，强制绕过任何下级推销或垃圾邮件分类；命中黑名单则直接拦截或隔离。</text>
    <rect x="710" y="25" width="110" height="30" rx="6" fill="#fef2f2" stroke="#f87171"/>
    <text x="725" y="45" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">优先级: 最高 (P1)</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 460 160 L 460 185" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="460,185 456,177 464,177" fill="#94a3b8"/>

  <!-- Level 2 Card -->
  <g transform="translate(40, 185)">
    <rect width="840" height="80" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#rShadow)"/>
    <rect width="120" height="80" rx="10" fill="#eff6ff"/>
    <path d="M120 0 v80" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Level 2</text>
    <text x="20" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#3b82f6">用户逻辑层</text>

    <text x="145" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">自定义复合规则与例外条件 (Custom Rules &amp; Exception Logic)</text>
    <text x="145" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">支持发件人、收件人、主题、正文多重组合判定。支持“例外条件”反向否决与跳过收件箱/自动标已读/移动分类等动作。</text>
    <rect x="710" y="25" width="110" height="30" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="725" y="45" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">优先级: 居中 (P2)</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 460 265 L 460 290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="460,290 456,282 464,282" fill="#94a3b8"/>

  <!-- Level 3 Card -->
  <g transform="translate(40, 290)">
    <rect width="840" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#rShadow)"/>
    <rect width="120" height="80" rx="10" fill="#ecfdf5"/>
    <path d="M120 0 v80" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857">Level 3</text>
    <text x="20" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#10b981">系统兜底层</text>

    <text x="145" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">系统启发式分类 (Heuristic Subscriptions &amp; Promotional Filters)</text>
    <text x="145" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">仅在前两级未匹配且未否决时介入。基于 Noreply/ESP/退订语义打标【订阅】，基于高密度促销词阵列打标【推销】。</text>
    <rect x="710" y="25" width="110" height="30" rx="6" fill="#ecfdf5" stroke="#34d399"/>
    <text x="725" y="45" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857">优先级: 兜底 (P3)</text>
  </g>
</svg>