<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="rf-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="rf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="480" fill="#090d16" />

  <text x="48" y="48" fill="#f8fafc" font-size="23" font-weight="700" letter-spacing="-0.4">EpoCanvas Docs 릴리스 흐름 (Release Workflow)</text>
  <text x="48" y="76" fill="#94a3b8" font-size="12.5">수정부터 배포까지: 다섯 개의 체크포인트, 태그 릴리스와 사이트 배포는 서로 독립적입니다</text>

  <line x1="115" y1="185" x2="885" y2="185" stroke="url(#rf-line)" stroke-width="2" stroke-opacity="0.55" />

  <g>
    <circle cx="130" cy="185" r="27" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="130" y="192" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="130" y="238" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">내용 수정</text>
    <text x="130" y="260" fill="#94a3b8" font-size="11.5" text-anchor="middle">Markdown 및 설정</text>
  </g>

  <g>
    <circle cx="315" cy="185" r="27" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="315" y="192" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="315" y="238" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">로컬 검증</text>
    <text x="315" y="260" fill="#94a3b8" font-size="11.5" text-anchor="middle">pnpm run verify</text>
  </g>

  <g>
    <circle cx="500" cy="185" r="27" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <text x="500" y="192" fill="#a78bfa" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="500" y="238" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">검토 요청</text>
    <text x="500" y="260" fill="#94a3b8" font-size="11.5" text-anchor="middle">PR 및 CI 전체 검증</text>
  </g>

  <g>
    <circle cx="685" cy="185" r="27" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="685" y="192" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="685" y="238" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">main에 병합</text>
    <text x="685" y="260" fill="#94a3b8" font-size="10.4" text-anchor="middle">작업 트리를 깨끗하게 유지</text>
  </g>

  <g>
    <circle cx="870" cy="185" r="27" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="870" y="192" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <text x="870" y="238" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">v* 태그 지정</text>
    <text x="870" y="260" fill="#94a3b8" font-size="11.5" text-anchor="middle">GitHub Release</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m212 180 5 5-5 5" />
    <path d="m397 180 5 5-5 5" />
    <path d="m582 180 5 5-5 5" />
    <path d="m767 180 5 5-5 5" />
  </g>

  <g filter="url(#rf-shadow)">
    <rect x="48" y="320" width="904" height="112" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect x="48" y="320" width="904" height="5" rx="2.5" fill="#10b981" fill-opacity="0.75" />

    <g transform="translate(76, 348)">
      <rect width="44" height="44" rx="9" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1" />
      <path d="M14 21V9a3 3 0 0 1 3-3h7l7 7v8a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3Zm10-15v7h7" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linejoin="round" />
    </g>

    <text x="140" y="362" fill="#f8fafc" font-size="15" font-weight="700">사이트 배포</text>
    <text x="140" y="386" fill="#94a3b8" font-size="12">main에서 pnpm run deploy 실행</text>
    <text x="140" y="408" fill="#f59e0b" font-size="10.5">태그를 지정해도 사이트가 자동 배포되지 않습니다. 배포 전에 main에서 다시 검증하세요.</text>
  </g>
</svg>
