<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.4">Cloudflare Pages 배포 방식 비교</text>
    <text x="0" y="48" fill="#94a3b8" font-size="13">로컬 직접 업로드와 선택적 Git 연동: 모두 전체 검증 필요</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">방법 1 · 권장</text>
      <text x="102" y="17" fill="#f8fafc" font-size="16" font-weight="700">로컬 CLI 직접 업로드 (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">저장소 스크립트가 배포 조건과 전체 검증 후 업로드</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">로컬 명령 한 줄: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">깨끗한 main 작업 트리, 원격 origin/main 커밋과 일치 필요</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">로컬 Astro 7이 dist/ 및 검색 인덱스 생성</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">pnpm run verify: 타입, 빌드, 테스트 및 콘텐츠 검사</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10" font-weight="600">Wrangler가 자격 증명을 읽어 Cloudflare Pages로 직접 업로드</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">배포 검사 통과 후 유효한 Cloudflare 인증 정보로 업로드</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">업로드 성공 후 배포 상태와 URL 확인</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">콘솔에서 브랜치와 커밋 확인 후 도메인 응답 검사</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">독립 미리보기: pnpm run deploy:preview</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">전체 verify 후 pnpm run verify:preview 실행</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="11">첫 배포 · 개인 유지보수 · 미리보기 검토; 배포 검사 필수</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">방법 2 · 선택</text>
      <text x="102" y="17" fill="#f8fafc" font-size="16" font-weight="700">Git 자동 빌드 (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">Git 연동 프로젝트를 만들고 저장소 연결</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">프로덕션 브랜치 push (예: main)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">자동 배포를 켜야 하며 GitHub CI 성공만으로는 배포되지 않음</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Pages가 설정된 저장소 브랜치 가져오기</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">프로젝트 설정에 맞게 Node.js와 pnpm 설치</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">클라우드 실행: pnpm run verify</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">먼저 pnpm install --frozen-lockfile로 설치</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.9" font-weight="600">미리보기 URL은 프로젝트 설정에 따라 생성</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">미리보기가 활성화된 브랜치나 PR에만 독립 URL 생성</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">검증 및 배포 성공 후 로그 확인</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">콘솔에서 상태, 브랜치, 커밋 및 도메인 확인</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="11">팀 협업 · 브랜치별 자동 배포 · 설정 가능한 PR 미리보기</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="18" fill="#10b981" font-size="12" font-weight="700">생성 시 프로젝트 유형 선택; 두 방식 모두 전체 검증 필요</text>
    <text x="20" y="35" fill="#94a3b8" font-size="10.2">Direct Upload에서 Git 연동으로 전환하려면 새 프로젝트 필요. Wrangler도 검증 필수. 이 그림은 배포 완료의 증거가 아닙니다.</text>
  </g>
</svg>
