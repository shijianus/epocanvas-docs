<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.4">EpoCanvas Docs デュアルモード検索 (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="11.2">ヘッダーのページ内ハイライト検索 vs Ctrl+K サイト全体 Pagefind WASM 検索</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">モード 1</text>
      <text x="92" y="17" fill="#f8fafc" font-size="12.6" font-weight="700">ヘッダーページ内検索 (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="8.6">現在の記事内の段落・コード行・パラメータを特定</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.1" font-weight="600">ヘッダー入力欄に直接キーワード入力</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">検索枠をクリックして入力、ショートカット不要</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">DOM テキストノードをリアルタイム走査・包装</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">スクリプトが記事 DOM を走査し一致文字へ &lt;mark&gt; を注入</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.1" font-weight="600">一致数をリアルタイム表示（例 3 / 9）</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">検索枠の右に現在位置と総数を表示し進捗を把握</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">キーボードジャンプとスムーズスクロール</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">Enter で次へ、Shift+Enter で前へ、本文をスムーズに中央へ</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="11" font-weight="600">Esc で一括解除し元の状態へ</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">Esc またはクリアボタンで全 &lt;mark&gt; を即時除去、残留なし</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="10.5">特長：フロントだけで動作 · 通信ゼロ · 入力即表示 · ミリ秒応答</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="8" font-weight="700" text-anchor="middle">モード 2</text>
      <text x="92" y="17" fill="#f8fafc" font-size="11.6" font-weight="700">サイト全体検索ダイアログ (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">全記事・セクション・コード・設定を横断して検索</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Ctrl+K / Cmd+K で起動</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9">画面中央にダイアログ、入力欄へ自動フォーカス、半透明のマスク</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">軽量な静的インデックス断片を必要に応じ取得</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">pagefind.wasm と対象文字のインデックス断片のみ取得（数 KB〜数十 KB）</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.8" font-weight="600">ブラウザ内で転置インデックスのスコア計算</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8">関連度スコアとソートもローカルで完結、タイトル一致を優先表示、遅延なし</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.2" font-weight="600">ドキュメント別グループと文脈プレビュー</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.3">記事タイトル・セクション経路・要約を表示しキーワードを強調</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.4" font-weight="600">キーボードだけで目的の段落へ</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.6">矢印で焦点移動、Enter で記事を開き錨へ正確にスムーズジャンプ</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="9.2">特長：静的転置索引 · 必要時ダウンロード · 全文横断 · 社内ネットワーク対応</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ ローカル実行</text>
    <text x="160" y="28" fill="#94a3b8" font-size="10">2 つの検索はすべて閲覧者のブラウザ内で完結。外部サービスやクローラキー（Algolia など）は不要で、外網へ出られない社内ネットワークでも快適に検索可能。</text>
  </g>
</svg>
