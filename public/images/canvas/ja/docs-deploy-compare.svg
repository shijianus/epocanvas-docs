<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="-0.4">Cloudflare Pages 2 つのデプロイ方式比較 (Deployment Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="10.4">ローカル CLI 直接アップロード（本サイト採用） vs Git 自動ビルド（チーム推奨）</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">方法 1 · 推奨</text>
      <text x="102" y="17" fill="#f8fafc" font-size="10.6" font-weight="700">ローカル CLI 直接アップロード (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="7.7">本サイトの実際の公開方式。ローカルビルド後エッジへ直接アップ</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.9" font-weight="600">ローカル 1 コマンド: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.2">同梱スクリプトがローカルビルドとアップロードを連結</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.6" font-weight="600">ローカルの Astro 5 が dist/ 成果物を生成</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.3">HTML/CSS 圧縮と Pagefind WASM インデックス生成もローカルで完結</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.1" font-weight="600">Wrangler が資格情報を読み込み Cloudflare Pages へ直アップ</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">ローカル API Token で差分ファイルのみアップロード</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.5" font-weight="600">数秒で公開、即席プレビュー URL を出力</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.9">アップロード完了後すぐ反映。キュー待ちやコンテナ調度は不要</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.3" font-weight="600">メインドメイン docs.epocanvas.com も同期更新</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.6">本番エイリアスを自動バインド、グローバル CDN のキャッシュも数秒で準備</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="9.7">適した場面：初回デプロイ · 単独運用 · 緊急修正 · クラウドビルド枠ゼロ</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">方法 2 · 協作</text>
      <text x="102" y="17" fill="#f8fafc" font-size="15" font-weight="700">Git 自動ビルド (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="8.9">GitHub リポジトリを接続、push でクラウド容器が自動ビルド</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">開発者が push: git push origin main</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">push が GitHub Webhook 通知をトリガー</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.1" font-weight="600">Cloudflare がビルドコンテナを自動割り当て</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.8">Pages が空きビルドノードを割り当て、ブランチをクリーン環境へ取得</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.7" font-weight="600">クラウドで実行: pnpm run build</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.6">コンテナが依存関係を導入し Astro をビルド、Pagefind インデックスも生成</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.8" font-weight="600">PR ブランチごとに独立プレビュー URL</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.6">Pull Request に専用プレビュー URL を自動生成し review を容易に</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.5" font-weight="600">ビルドログとデプロイ履歴を全記録</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.9">Cloudflare コンソールで完全なログを確認、ワンクリックロールバック</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="10.1">適した場面：チーム協業 · push 即公開 · 個別キー不要 · PR プレビュー</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ 両方式の共存</text>
    <text x="145" y="28" fill="#94a3b8" font-size="11">2 方式は共存可能：日常は Git 自動化、緊急修正やオフライン時は pnpm run deploy でいつでも上書き公開。</text>
  </g>
</svg>
