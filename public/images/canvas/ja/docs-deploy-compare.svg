<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="18.4" font-weight="700" letter-spacing="-0.4">Cloudflare Pages デプロイ方式の比較</text>
    <text x="0" y="48" fill="#94a3b8" font-size="10.9">ローカル直接アップロードと任意の Git 連携：どちらも全検証が必要</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">方法 1 · 推奨</text>
      <text x="102" y="17" fill="#f8fafc" font-size="10.6" font-weight="700">ローカル CLI 直接アップロード (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="10.4">公開条件を確認し、全検証後にアップロード</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.9" font-weight="600">ローカル 1 コマンド: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.3">main・クリーンな作業ツリー・リモート origin/main と同じコミットが必要</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.3" font-weight="600">ローカルの Astro 7 が dist/ と検索索引を生成</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.1">pnpm run verify：型・ビルド・テスト・内容を検証</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.1" font-weight="600">Wrangler が資格情報を読み込み Cloudflare Pages へ直アップ</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.9">公開チェック後、有効な Cloudflare 認証情報でアップロード</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.9" font-weight="600">アップロード成功後、状態と URL を確認</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.3">コンソールでブランチとコミットを確認し、ドメインの応答を検証</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.2" font-weight="600">独立プレビュー: pnpm run deploy:preview</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">全 verify 後、pnpm run verify:preview を実行</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="9.5">初回公開・個人運用・プレビュー確認向け。公開チェックは必須</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">方法 2 · 任意</text>
      <text x="102" y="17" fill="#f8fafc" font-size="15" font-weight="700">Git 自動ビルド (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="7.3">Git 連携プロジェクトを作成しリポジトリを接続</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.5" font-weight="600">本番ブランチに push（例：main）</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.2">自動デプロイを有効にする。GitHub CI 成功だけでは公開されない</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.6" font-weight="600">Pages が設定済みブランチを取得</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.7">プロジェクト設定に従い Node.js と pnpm を導入</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.7" font-weight="600">クラウドで実行: pnpm run verify</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.3">先に pnpm install --frozen-lockfile で依存関係を導入</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">プレビュー URL はプロジェクト設定に依存</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.5">プレビューを有効にしたブランチや PR のみ個別 URL を生成</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.5" font-weight="600">検証・デプロイ成功後にログを確認</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.3">コンソールで状態・ブランチ・コミット・ドメインを確認</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="8.3">チーム協業・ブランチ別自動デプロイ・設定可能な PR プレビュー向け</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="18" fill="#10b981" font-size="8.8" font-weight="700">作成時にプロジェクト種別を選択。両方式とも全検証が必要</text>
    <text x="20" y="35" fill="#94a3b8" font-size="7.9">Direct Upload から Git 連携へは別プロジェクトが必要。Wrangler も検証必須。この図は公開済みの証拠ではありません。</text>
  </g>
</svg>
