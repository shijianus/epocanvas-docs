<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%" fill="none">
  <defs>
    <filter id="mShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="940" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">EpoMail 企业级 RBAC 角色权限与资源配额矩阵</text>
  <text x="40" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#64748b">基于身份域独立 D1 数据库，实现菜单权限、API鉴权、发信额度、存储配额与专属 AI 模型池动态隔离</text>

  <!-- Table Header -->
  <g transform="translate(40, 75)">
    <rect width="860" height="36" rx="6" fill="#e2e8f0"/>
    <text x="20" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">角色代码 / 标识</text>
    <text x="160" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">角色名称</text>
    <text x="270" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">发信日限额</text>
    <text x="370" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">存储配额</text>
    <text x="465" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">附件收发</text>
    <text x="555" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">账号别名数</text>
    <text x="670" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">模型池与权限范围</text>
  </g>

  <!-- Row 1: visitor -->
  <g transform="translate(40, 120)">
    <rect width="860" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#mShadow)"/>
    <text x="20" y="27" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#6366f1">visitor</text>
    <text x="160" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">参观者 (沙箱)</text>
    <text x="270" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#ef4444">禁止 (0封)</text>
    <text x="370" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#64748b">0 MB</text>
    <text x="465" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#ef4444">关闭</text>
    <text x="555" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#64748b">0 个</text>
    <text x="670" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">只读体验, 无写权限</text>
  </g>

  <!-- Row 2: user_base -->
  <g transform="translate(40, 172)">
    <rect width="860" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#mShadow)"/>
    <text x="20" y="27" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#475569">user_base</text>
    <text x="160" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">普通用户 (基础)</text>
    <text x="270" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">5 封 / 日</text>
    <text x="370" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">5 MB</text>
    <text x="465" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#ef4444">关闭</text>
    <text x="555" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">1 个</text>
    <text x="670" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">基础收发, Workers AI</text>
  </g>

  <!-- Row 3: user_lv0 -->
  <g transform="translate(40, 224)">
    <rect width="860" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#mShadow)"/>
    <text x="20" y="27" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#10b981">user_lv0</text>
    <text x="160" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">普通用户 LV.0</text>
    <text x="270" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">8 封 / 日</text>
    <text x="370" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">10 MB</text>
    <text x="465" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#ef4444">关闭</text>
    <text x="555" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">2 个</text>
    <text x="670" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">博客认证成员, 进阶额度</text>
  </g>

  <!-- Row 4: user_lv1 -->
  <g transform="translate(40, 276)">
    <rect width="860" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#mShadow)"/>
    <text x="20" y="27" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#06b6d4">user_lv1</text>
    <text x="160" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">普通用户 LV.1</text>
    <text x="270" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">10 封 / 日</text>
    <text x="370" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">25 MB</text>
    <text x="465" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">开放 (R2)</text>
    <text x="555" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">3 个</text>
    <text x="670" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#0891b2">开放附件, 多模型池</text>
  </g>

  <!-- Row 5: moderator -->
  <g transform="translate(40, 328)">
    <rect width="860" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#mShadow)"/>
    <text x="20" y="27" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#f59e0b">moderator</text>
    <text x="160" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">协管者 / 管理员</text>
    <text x="270" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">100 封 / 日</text>
    <text x="370" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">500 MB</text>
    <text x="465" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">开放 (R2)</text>
    <text x="555" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#1e293b">10 个</text>
    <text x="670" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#d97706">用户管理, 全局邮件巡检</text>
  </g>

  <!-- Row 6: master -->
  <g transform="translate(40, 380)">
    <rect width="860" height="44" rx="6" fill="#fff1f2" stroke="#fecdd3" filter="url(#mShadow)"/>
    <text x="20" y="27" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#e11d48">master</text>
    <text x="160" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#be123c">站长 (最高统领)</text>
    <text x="270" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#be123c">无限制</text>
    <text x="370" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#be123c">1024 MB+</text>
    <text x="465" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">完全开放</text>
    <text x="555" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#be123c">无限制</text>
    <text x="670" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#be123c">全量通配 (*) 权限与模型</text>
  </g>
</svg>
