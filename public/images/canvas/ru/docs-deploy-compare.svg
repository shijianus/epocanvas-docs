<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="16.1" font-weight="700" letter-spacing="-0.4">Способы развёртывания Cloudflare Pages</text>
    <text x="0" y="48" fill="#94a3b8" font-size="9.5">Локальная загрузка или интеграция Git: полная проверка обязательна</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="6.82" font-weight="700" text-anchor="middle">Способ 1 · рекомендуется</text>
      <text x="102" y="17" fill="#f8fafc" font-size="10.8" font-weight="700">Прямая загрузка из консоли (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="7.9">Скрипты проверяют условия публикации до загрузки</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.7" font-weight="600">Одна локальная команда: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.8">Чистая main; коммит совпадает с удалённой origin/main</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.9" font-weight="600">Astro 7 создаёт dist/ и поисковый индекс локально</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.7">pnpm run verify: типы, сборка, тесты и контент</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.5" font-weight="600">Wrangler читает учётные данные и грузит на Cloudflare Pages</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.2">После проверок загрузка с действующими данными Cloudflare</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.8" font-weight="600">После загрузки проверьте статус и адрес</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.5">Проверьте ветку и коммит в панели, затем ответ домена</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.4" font-weight="600">Отдельное превью: pnpm run deploy:preview</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.5">После полного verify: pnpm run verify:preview</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="7.9">Первый деплой, личная работа, ревью превью; проверки обязательны</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="8.3" font-weight="700" text-anchor="middle">Способ 2 · опция</text>
      <text x="102" y="17" fill="#f8fafc" font-size="13.3" font-weight="700">Автосборка из Git (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Создайте проект с интеграцией Git и подключите репозиторий</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.5" font-weight="600">Push в рабочую ветку (например, main)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.1">Включите автодеплой; успешный GitHub CI сам не публикует</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.3" font-weight="600">Pages получает настроенную ветку</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Установите Node.js и pnpm по настройкам проекта</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">В облаке: pnpm run verify</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.5">Сначала установка: pnpm install --frozen-lockfile</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Адреса превью зависят от настроек проекта</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Отдельный адрес лишь для веток или PR с включённым превью</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">После проверок и успешного деплоя изучите журнал</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.5">Сверьте статус, ветку, коммит и домен в панели</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="9">Для команд: деплой по веткам и настраиваемые превью PR</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="18" fill="#10b981" font-size="7.4399999999999995" font-weight="700">Тип проекта выбирается при создании; оба пути требуют полной проверки</text>
    <text x="20" y="35" fill="#94a3b8" font-size="6.9">Переход с Direct Upload на Git требует нового проекта; Wrangler тоже требует проверок. Схема не доказывает факт деплоя.</text>
  </g>
</svg>
