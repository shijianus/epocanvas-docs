<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="rp-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="rp-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="520" fill="#090d16" />

  <!-- Title & Description Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="19.9" font-weight="700" letter-spacing="-0.4">Конвейер рендеринга EpoCanvas Docs (Build &amp; Rendering Pipeline)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="8.6">Пятиэтапный жизненный цикл сборки: от исходников Markdown до статического HTML и индекса Pagefind</text>
  </g>

  <!-- Stage 1: Content Collection & Validation -->
  <g transform="translate(30, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-sky)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#0284c7" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="50" y="34" fill="#38bdf8" font-size="8.06" font-weight="700">Сбор и проверка контента</text>
    <text x="50" y="48" fill="#64748b" font-size="10">Content Scan</text>

    <!-- Content Items -->
    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">Входная точка сканирования исходников</text>
    <text x="22" y="100" fill="#94a3b8" font-size="10">src/content/docs/</text>
    <text x="22" y="112" fill="#64748b" font-size="6.8">Индексация *.md и *.mdx</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="8.5" font-weight="600">Проверка Frontmatter</text>
    <text x="22" y="160" fill="#38bdf8" font-size="8.2">title обязателен</text>
    <text x="22" y="174" fill="#94a3b8" font-size="5.58">description берётся как аннотация</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#38bdf8" font-size="7.5" font-weight="600">Защита fail-fast</text>
    <text x="22" y="230" fill="#94a3b8" font-size="6.3">Без title сборка прерывается</text>
    <text x="22" y="244" fill="#ef4444" font-size="6.1">Выбрасывает InvalidInputError</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Документ без заголовка не попадёт в прод</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 212 265 L 230 265" stroke="#38bdf8" stroke-width="2" />
  <polygon points="230,261 238,265 230,269" fill="#38bdf8" />

  <!-- Stage 2: Markdown & GFM Compilation -->
  <g transform="translate(236, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-blue)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#2563eb" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="50" y="34" fill="#60a5fa" font-size="8.6" font-weight="700">Компиляция Markdown</text>
    <text x="50" y="48" fill="#64748b" font-size="10">GFM AST Parse</text>

    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">Преобразование расширенного синтаксиса GFM</text>
    <text x="22" y="100" fill="#94a3b8" font-size="7.3">Таблицы / чек-листы / сноски</text>
    <text x="22" y="112" fill="#64748b" font-size="5.58">Преобразуется в стандартный семантический HTML</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="6.82" font-weight="600">Оптимизация таблиц Rehype</text>
    <text x="22" y="160" fill="#60a5fa" font-size="10">rehypeWrapTables</text>
    <text x="22" y="174" fill="#94a3b8" font-size="5.58">Автоматическая обёртка .table-wrapper</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#2563eb" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#60a5fa" font-size="10.6" font-weight="600">Врезки (Asides)</text>
    <text x="22" y="230" fill="#94a3b8" font-size="9">:::note / tip / caution</text>
    <text x="22" y="244" fill="#94a3b8" font-size="7.1">:::danger цветные врезки</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Подставляет иконку и цвет состояния</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 418 265 L 436 265" stroke="#60a5fa" stroke-width="2" />
  <polygon points="436,261 444,265 436,269" fill="#60a5fa" />

  <!-- Stage 3: Code Highlighting -->
  <g transform="translate(442, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-violet)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#7c3aed" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="50" y="34" fill="#a78bfa" font-size="8.06" font-weight="700">Подсветка блоков кода</text>
    <text x="50" y="48" fill="#64748b" font-size="10">Expressive Code</text>

    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">Раскраска синтаксиса движком Shiki</text>
    <text x="22" y="100" fill="#94a3b8" font-size="6.2">Точный лексический анализ многих языков</text>
    <text x="22" y="112" fill="#64748b" font-size="5.6">Адаптация к обеим темам</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="6.82" font-weight="600">Продвинутые аннотации</text>
    <text x="22" y="160" fill="#a78bfa" font-size="6.2">Ярлык имени файла через title="..."</text>
    <text x="22" y="174" fill="#94a3b8" font-size="6.8">Подсветка фоном строк {2-4}</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#a78bfa" font-size="6.82" font-weight="600">Интерактив и улучшенные diff</text>
    <text x="22" y="230" fill="#94a3b8" font-size="7.3">Метки изменений ```diff</text>
    <text x="22" y="244" fill="#94a3b8" font-size="5.58">Кнопка копирования справа вверху</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Сторонние плагины подсветки не нужны</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 624 265 L 642 265" stroke="#a78bfa" stroke-width="2" />
  <polygon points="642,261 650,265 642,269" fill="#a78bfa" />

  <!-- Stage 4: Layout & Component Overrides -->
  <g transform="translate(648, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-amber)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#d97706" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="50" y="34" fill="#fbbf24" font-size="8.06" font-weight="700">Сборка пользовательского макета</text>
    <text x="50" y="48" fill="#64748b" font-size="10">Starlight Overrides</text>

    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">Внедрено 7 собственных компонентов</text>
    <text x="22" y="100" fill="#fbbf24" font-size="10">Header / Sidebar / TOC</text>
    <text x="22" y="112" fill="#64748b" font-size="7.8">TwoColumn / Search и др.</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="6.82" font-weight="600">Метаданные и отметки времени</text>
    <text x="22" y="160" fill="#94a3b8" font-size="6.3">PageTitle выводит заголовок</text>
    <text x="22" y="174" fill="#94a3b8" font-size="5.58">Берёт реальный последний коммит Git</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#d97706" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#fbbf24" font-size="6.82" font-weight="600">Оглавление и карточки навигации</text>
    <text x="22" y="230" fill="#94a3b8" font-size="5.58">##/### автоматически попадают в оглавление</text>
    <text x="22" y="244" fill="#94a3b8" font-size="5.58">Карточки Pagination с диагональными стрелками</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Боковая панель помнит позицию прокрутки</text>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <path d="M 830 265 L 848 265" stroke="#fbbf24" stroke-width="2" />
  <polygon points="848,261 856,265 848,269" fill="#fbbf24" />

  <!-- Stage 5: Static Output & Pagefind -->
  <g transform="translate(854, 115)" filter="url(#rp-shadow)">
    <rect width="136" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="136" height="6" rx="3" fill="url(#grad-emerald)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#059669" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="48" y="34" fill="#34d399" font-size="7.4399999999999995" font-weight="700">Статический вывод и индексация</text>
    <text x="48" y="48" fill="#64748b" font-size="10">Pagefind &amp; Dist</text>

    <rect x="12" y="66" width="112" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">Чисто статический результат</text>
    <text x="18" y="100" fill="#34d399" font-size="7.4">Каталог dist/</text>
    <text x="18" y="112" fill="#64748b" font-size="6.7">Только HTML + CSS</text>

    <rect x="12" y="126" width="112" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="144" fill="#e2e8f0" font-size="9.2" font-weight="600">Индекс Pagefind</text>
    <text x="18" y="160" fill="#34d399" font-size="10">pagefind.wasm</text>
    <text x="18" y="174" fill="#94a3b8" font-size="5.58">Блочные сжатые словари</text>

    <rect x="12" y="196" width="112" height="88" rx="6" fill="#0b0f19" stroke="#059669" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="18" y="214" fill="#34d399" font-size="6.82" font-weight="600">Готов к edge</text>
    <text x="18" y="230" fill="#94a3b8" font-size="6.1">Генерация sitemap</text>
    <text x="18" y="244" fill="#94a3b8" font-size="5.58">Прямая загрузка Wrangler</text>
    <text x="18" y="268" fill="#64748b" font-size="5.58">Разворачивается на любом статическом хостинге</text>
  </g>

  <!-- Bottom Summary Info Pill -->
  <g transform="translate(30, 435)">
    <rect width="960" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="26" cy="26" r="8" fill="#38bdf8" fill-opacity="0.2" />
    <text x="26" y="30" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">i</text>
    <text x="46" y="23" fill="#f8fafc" font-size="9.3" font-weight="600">Итоги конвейера</text>
    <text x="46" y="39" fill="#94a3b8" font-size="6.2">Вся компиляция, подсветка и индексация выполняются на этапе сборки. В проде нет серверных вычислений, ноль нагрузки фреймворков в клиенте, быстрый первый экран, работает и во внутренней сети.</text>
  </g>
</svg>
