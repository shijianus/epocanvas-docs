<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.4">Поиск двух режимов EpoCanvas Docs (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="9.4">Подсветка по странице из шапки vs поиск по всему сайту Pagefind WASM через Ctrl+K</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle">Режим 1</text>
      <text x="92" y="17" fill="#f8fafc" font-size="9.92" font-weight="700">Поиск внутри страницы из шапки (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Находит абзацы, строки кода и параметры текущей статьи</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Ключевые слова вводятся прямо в поле шапки</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.1">Кликните по полю и печатайте — без сочетаний клавиш</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Обход и обёртка текстовых узлов DOM в реальном времени</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9">Скрипт обходит DOM статьи и подсвечивает совпадения через &lt;mark&gt;</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Счётчик совпадений в реальном времени (например, 3 / 9)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.3">Справа от поля видны текущий номер и общее число совпадений</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Переходы с клавиатуры и плавная прокрутка</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.2">Enter — вперёд, Shift+Enter — назад, плавное центрирование</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Esc убирает всё разом</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">Esc или кнопка очистки мгновенно снимает все &lt;mark&gt; без следов</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="7.1">Чистый фронтенд над DOM · ноль запросов · мгновенный показ · отклик в миллисекундах</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="8.5" font-weight="700" text-anchor="middle">Режим 2</text>
      <text x="92" y="17" fill="#f8fafc" font-size="11.5" font-weight="700">Диалог поиска по сайту (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="8.2">Ищет по всем статьям, разделам, блокам кода и настройкам</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="11.1" font-weight="600">Вызывается через Ctrl+K / Cmd+K</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.9">Диалог по центру экрана, фокус в поле, полупрозрачная подложка</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Лёгкие статические фрагменты индекса — по требованию</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.3">Грузятся только pagefind.wasm и фрагменты под введённые символы (единицы–десятки КБ)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Оценка по инвертированному индексу в памяти браузера</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Релевантность и сортировка считаются локально; совпадения в заголовках — первыми, без сетевых задержек</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Группировка по документам с превью контекста</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.1">Показывает статью, путь раздела и выдержку, ключевые слова подсвечены</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Навигация с клавиатуры до нужного абзаца</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.7">Стрелки двигают фокус, Enter открывает статью точно на анкоре</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="6.82">Статический инвертированный индекс · загрузка по требованию · весь сайт · работает в интранете</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ Локально</text>
    <text x="160" y="28" fill="#94a3b8" font-size="8.8">Оба поиска полностью выполняются в браузере читателя — без внешних сервисов и ключей краулера (вроде Algolia); работает даже в закрытой корпоративной сети.</text>
  </g>
</svg>
