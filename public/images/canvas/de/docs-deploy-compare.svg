<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="18.6" font-weight="700" letter-spacing="-0.4">Cloudflare Pages: zwei Bereitstellungswege (Deployment Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="8.6">Lokaler CLI-Direktupload (diese Site) vs automatischer Git-Build (für Teams empfohlen)</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="6.82" font-weight="700" text-anchor="middle">Variante 1 · empfohlen</text>
      <text x="102" y="17" fill="#f8fafc" font-size="11.3" font-weight="700">Lokaler CLI-Direktupload (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">So geht diese Site live: lokal bauen, direkt zur Edge hochladen</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.8" font-weight="600">Ein lokaler Befehl: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7">Das mitgelieferte Skript verkettet lokalen Build und Upload</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.1" font-weight="600">Astro 5 erzeugt das dist/-Ergebnis lokal</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.1">HTML/CSS-Minimierung und Pagefind-WASM-Index entstehen lokal</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Wrangler liest die Zugangsdaten und lädt zu Cloudflare Pages hoch</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.9">Liest das lokale API-Token, lädt nur geänderte Dateien hoch</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">In Sekunden live, inklusive sofortiger Vorschau-URL</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.3">Sofort wirksam — keine Cloud-Warteschlangen, keine Container-Orchestrierung</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.5" font-weight="600">Hauptdomain docs.epocanvas.com wird mit aktualisiert</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.3">Produktionsalias automatisch gebunden; CDN-Cache weltweit in Sekunden bereit</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="8.3">Geeignet für: Erstdeploy · Solo-Betrieb · Hotfixes · kein Build-Kontingent</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="7.8" font-weight="700" text-anchor="middle">Variante 2 · Team</text>
      <text x="102" y="17" fill="#f8fafc" font-size="11.3" font-weight="700">Automatischer Git-Build (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="7.4">GitHub-Repo verbinden; jeder Push baut automatisch im Container</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="11.2" font-weight="600">Entwickler-Push: git push origin main</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.3">Der Push löst eine GitHub-Webhook-Benachrichtigung aus</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Cloudflare teilt automatisch einen Build-Container zu</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Pages plant einen freien Builder und klont den Branch in eine saubere Umgebung</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.9" font-weight="600">In der Cloud: pnpm run build</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Der Container installiert Abhängigkeiten, baut die Site und erzeugt den Pagefind-Index</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.7" font-weight="600">Eigene Vorschau-URL pro PR-Branch</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.8">Jeder Pull Request erhält eine eigene Vorschau-URL für die Review</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Vollständige Build-Logs und Deploy-Historie</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.2">Komplette Logs im Cloudflare-Dashboard, Rollback per Klick</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="8.5">Geeignet für: Teams · Push = live · keine Cloud-Keys nötig · PR-Vorschauen</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ Koexistenz</text>
    <text x="145" y="28" fill="#94a3b8" font-size="9.6">Beide Wege koexistieren: im Alltag per Git-Automatisierung; im Notfall überschreibt pnpm run deploy lokal jederzeit die Live-Version.</text>
  </g>
</svg>
