<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="19.3" font-weight="700" letter-spacing="-0.4">Búsqueda de doble modo en EpoCanvas Docs (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="9.4">Resaltado en página desde la cabecera vs búsqueda global Pagefind WASM con Ctrl+K</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Modo 1</text>
      <text x="92" y="17" fill="#f8fafc" font-size="9.92" font-weight="700">Búsqueda en página desde la cabecera (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Localiza párrafos, líneas de código y parámetros del artículo actual</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Escriba palabras clave en el cuadro de la cabecera</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.6">Haga clic en el cuadro y escriba; sin atajos de teclado</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Recorrido y envoltorio de nodos de texto del DOM en tiempo real</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.7">El script recorre el DOM del artículo e inyecta &lt;mark&gt; en las coincidencias</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Contador de coincidencias en vivo (p. ej. 3 / 9)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">A la derecha del cuadro se ven el índice actual y el total, progreso siempre visible</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Saltos por teclado con desplazamiento suave</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.8">Enter avanza, Shift+Enter retrocede, el párrafo se centra suavemente</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.1" font-weight="600">Esc lo limpia todo de una vez</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.9">Con Esc o el botón de borrar desaparecen todos los &lt;mark&gt; sin rastro</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="6.82">Front-end puro sobre el DOM · cero peticiones · resultado inmediato · respuesta en milisegundos</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">Modo 2</text>
      <text x="92" y="17" fill="#f8fafc" font-size="10.5" font-weight="700">Diálogo de búsqueda global (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Busca en todos los artículos, secciones, bloques de código y configuración</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Se abre con Ctrl+K / Cmd+K</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8">Diálogo centrado con foco automático y fondo semitransparente</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Descarga fragmentos ligeros de índice a demanda</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.8">Carga solo pagefind.wasm y los fragmentos de los caracteres tecleados (unos KB)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Puntuación del índice invertido en memoria del navegador</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">La relevancia y el orden se calculan en local; los títulos coincidentes van primero</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Agrupado por documento con vista previa del contexto</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.6">Muestra artículo, ruta de sección y fragmento, con las palabras resaltadas</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Navegación por teclado hasta el párrafo exacto</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.8">Las flechas mueven el foco; Enter abre el artículo justo en el ancla</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="7.4">Índice invertido estático · descarga a demanda · todo el sitio · válido en intranet</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ 100% local</text>
    <text x="160" y="28" fill="#94a3b8" font-size="7.3">Ambas búsquedas se ejecutan por completo en el navegador del lector: sin servicios externos ni claves de rastreo (como Algolia), y funcionan incluso en una intranet sin salida a internet.</text>
  </g>
</svg>
