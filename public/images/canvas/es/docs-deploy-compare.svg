<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="14.6" font-weight="700" letter-spacing="-0.4">Opciones de despliegue en Cloudflare Pages</text>
    <text x="0" y="48" fill="#94a3b8" font-size="8.5">Subida local o integración Git opcional: verificación completa obligatoria</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="6.82" font-weight="700" text-anchor="middle">Método 1 · recomendado</text>
      <text x="102" y="17" fill="#f8fafc" font-size="10.3" font-weight="700">Subida directa por CLI local (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">El script comprueba requisitos y verifica antes de subir</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.9" font-weight="600">Un solo comando local: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.7">Requiere main limpio y el mismo commit que origin/main remoto</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.6" font-weight="600">Astro 7 genera dist/ e índices de búsqueda en local</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.2">pnpm run verify: tipos, compilación, pruebas y contenido</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8" font-weight="600">Wrangler lee las credenciales y sube a Cloudflare Pages</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.5">Tras los controles, suba con credenciales válidas de Cloudflare</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.6" font-weight="600">Tras subir, compruebe el estado y la URL</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Revise rama y commit en el panel; luego pruebe el dominio</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.8" font-weight="600">Vista previa aparte: pnpm run deploy:preview</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8">Tras verify completo, ejecute pnpm run verify:preview</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="6.82">Para primer despliegue, trabajo individual y vistas previas; controles obligatorios</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="6.9" font-weight="700" text-anchor="middle">Método 2 · opcional</text>
      <text x="102" y="17" fill="#f8fafc" font-size="9.92" font-weight="700">Compilación automática por Git (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Cree un proyecto con integración Git y conecte el repositorio</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Envíe la rama de producción (p. ej. main)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Active el despliegue automático; GitHub CI por sí solo no publica</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.1" font-weight="600">Pages obtiene la rama configurada</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Instale Node.js y pnpm según la configuración del proyecto</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.7" font-weight="600">En la nube: pnpm run verify</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.3">Primero instale con pnpm install --frozen-lockfile</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Las URL de vista previa dependen de la configuración</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Solo las ramas o PR con vistas previas activadas reciben URL propia</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Tras verificar y desplegar con éxito, revise los registros</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7">Revise estado, rama, commit y dominio en el panel</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="7">Para equipos, despliegue por rama y vistas previas de PR configurables</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="18" fill="#10b981" font-size="7.4399999999999995" font-weight="700">Elija el tipo de proyecto al crearlo; ambas vías exigen verificación completa</text>
    <text x="20" y="35" fill="#94a3b8" font-size="6.82">Pasar de Direct Upload a Git requiere otro proyecto; Wrangler también exige controles. El diagrama no acredita un despliegue.</text>
  </g>
</svg>
