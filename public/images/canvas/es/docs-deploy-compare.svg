<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="19.1" font-weight="700" letter-spacing="-0.4">Cloudflare Pages: dos vías de despliegue (Deployment Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="8.06">Subida directa por CLI local (este sitio) vs compilación automática por Git (recomendado en equipo)</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="6.82" font-weight="700" text-anchor="middle">Método 1 · recomendado</text>
      <text x="102" y="17" fill="#f8fafc" font-size="10.3" font-weight="700">Subida directa por CLI local (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="7.3">Así publica este sitio: compila en local y sube a la edge</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.9" font-weight="600">Un solo comando local: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.9">El script incluido encadena la compilación local y la subida</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.7" font-weight="600">Astro 5 genera el resultado dist/ en su máquina</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.9">Minificado HTML/CSS e índice Pagefind WASM generados en local</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8" font-weight="600">Wrangler lee las credenciales y sube a Cloudflare Pages</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.9">Lee el API token local y sube solo los archivos modificados</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">En línea en segundos, con URL de vista previa inmediata</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.5">Efectivo al terminar la subida; sin colas ni contenedores de compilación</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">El dominio principal docs.epocanvas.com se actualiza a la vez</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.4">Alias de producción enlazado solo; caché global lista en segundos</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="6.82">Ideal para: primer despliegue · trabajo en solitario · urgencias · sin cuota de compilación</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="6.82" font-weight="700" text-anchor="middle">Método 2 · colaboración</text>
      <text x="102" y="17" fill="#f8fafc" font-size="9.92" font-weight="700">Compilación automática por Git (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Conecta un repositorio de GitHub; cada push compila en un contenedor en la nube</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">La persona desarrolladora hace push: git push origin main</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">El push dispara una notificación webhook de GitHub</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.6" font-weight="600">Cloudflare asigna un contenedor de compilación</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.1">Pages reserva un nodo libre y clona la rama en un entorno limpio</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.7" font-weight="600">En la nube: pnpm run build</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">El contenedor instala dependencias, compila el sitio y genera el índice Pagefind</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">URL de vista previa independiente por rama de PR</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7">Cada pull request recibe su URL de vista previa para revisión del equipo</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Registros de compilación e historial de despliegues completos</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.2">Registro completo en el panel de Cloudflare, rollback con un clic</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="7.4">Ideal para: equipos · push = en línea · sin claves por persona · vistas previas de PR</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ Convivencia</text>
    <text x="145" y="28" fill="#94a3b8" font-size="8.7">Ambas vías conviven: automatice con Git el día a día y, ante una urgencia, ejecute pnpm run deploy en local para sobrescribir la versión en línea.</text>
  </g>
</svg>
