<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="astro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="fshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="#090d16" />

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="700">Starlight 组件覆写与运行时注入拓扑 (Component Overrides Engine)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Astro.locals.starlightRoute 上下文流动与原生 Starlight 插槽完全接管机制</text>

  <!-- Left Source: Astro Config -->
  <g transform="translate(40, 110)" filter="url(#fshadow)">
    <rect width="240" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect width="240" height="36" rx="10" fill="#1e293b" />
    <text x="20" y="24" fill="#38bdf8" font-size="12" font-weight="700">astro.config.mjs</text>
    <text x="20" y="58" fill="#94a3b8" font-size="11">starlight({</text>
    <text x="35" y="78" fill="#e2e8f0" font-size="11">components: {</text>
    <text x="50" y="98" fill="#818cf8" font-size="11">Header: './src/...'</text>
    <text x="50" y="118" fill="#818cf8" font-size="11">Sidebar: './src/...'</text>
    <text x="50" y="138" fill="#818cf8" font-size="11">PageTitle: './src/...'</text>
    <text x="50" y="158" fill="#818cf8" font-size="11">TableOfContents</text>
    <text x="50" y="178" fill="#818cf8" font-size="11">TwoColumnContent</text>
    <text x="50" y="198" fill="#818cf8" font-size="11">Search: './src/...'</text>
    <text x="35" y="218" fill="#e2e8f0" font-size="11">}</text>
    <text x="20" y="238" fill="#94a3b8" font-size="11">})</text>

    <!-- Route Context info -->
    <rect x="15" y="260" width="210" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="25" y="282" fill="#f59e0b" font-size="11" font-weight="600">Astro.locals.starlightRoute</text>
    <text x="25" y="300" fill="#94a3b8" font-size="10">• sidebar: 导航树结构</text>
    <text x="25" y="316" fill="#94a3b8" font-size="10">• toc: 当前页面标题目录</text>
  </g>

  <!-- Connect Arrow -->
  <path d="M 290 280 L 340 280" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="340,276 348,280 340,284" fill="#6366f1" />

  <!-- Middle: 6 Custom Components in src/components/starlight/ -->
  <g transform="translate(360, 110)">
    <!-- Header.astro -->
    <g transform="translate(0, 0)" filter="url(#fshadow)">
      <rect width="260" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Header.astro</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">i18n 10 国语言下拉 · 动态导航按钮 · 版本 Tag</text>
    </g>

    <!-- Sidebar.astro -->
    <g transform="translate(0, 60)" filter="url(#fshadow)">
      <rect width="260" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Sidebar.astro &amp; Persister</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">无缝页面过渡 · 滚动位置记忆 · 目录树高亮</text>
    </g>

    <!-- TwoColumnContent.astro -->
    <g transform="translate(0, 120)" filter="url(#fshadow)">
      <rect width="260" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">TwoColumnContent.astro</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">固定右侧边栏 · CSS Grid 隔离 · 宽屏响应式</text>
    </g>

    <!-- TableOfContents.astro -->
    <g transform="translate(0, 180)" filter="url(#fshadow)">
      <rect width="260" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">TableOfContents.astro</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">starlight-toc.ts 交叉监听器 · 动态滚动锚定</text>
    </g>

    <!-- Search.astro -->
    <g transform="translate(0, 240)" filter="url(#fshadow)">
      <rect width="260" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Search.astro</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Pagefind WASM 模态弹窗 · 键盘 Cmd+K 监听</text>
    </g>

    <!-- PageTitle.astro -->
    <g transform="translate(0, 300)" filter="url(#fshadow)">
      <rect width="260" height="50" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">PageTitle.astro</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">SEO 元标签标准 · 规范化文章主副标题与徽章</text>
    </g>
  </g>

  <!-- Connect Arrow -->
  <path d="M 630 280 L 680 280" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="680,276 688,280 680,284" fill="#10b981" />

  <!-- Right: Final Render Output -->
  <g transform="translate(700, 110)" filter="url(#fshadow)">
    <rect width="220" height="350" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <rect width="220" height="36" rx="10" fill="#064e3b" />
    <text x="20" y="24" fill="#34d399" font-size="12" font-weight="700">Client DOM 渲染输出</text>

    <text x="20" y="65" fill="#f8fafc" font-size="11" font-weight="600">1. 零冗余水合</text>
    <text x="20" y="83" fill="#94a3b8" font-size="10">静态纯 HTML / CSS 优先</text>

    <text x="20" y="115" fill="#f8fafc" font-size="11" font-weight="600">2. 状态保持与平滑跳转</text>
    <text x="20" y="133" fill="#94a3b8" font-size="10">页面切换无需重新加载导航</text>

    <text x="20" y="165" fill="#f8fafc" font-size="11" font-weight="600">3. 10 种语言秒级响应</text>
    <text x="20" y="183" fill="#94a3b8" font-size="10">DOM 文本节点客户端直接置换</text>

    <text x="20" y="215" fill="#f8fafc" font-size="11" font-weight="600">4. 离线全量静态检索</text>
    <text x="20" y="233" fill="#94a3b8" font-size="10">WebAssembly 毫秒级命中</text>

    <rect x="15" y="270" width="190" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="25" y="295" fill="#10b981" font-size="11" font-weight="600">✓ 100% Lighthouse 得分</text>
    <text x="25" y="315" fill="#94a3b8" font-size="10">极致首屏首字节与交互性能</text>
  </g>
</svg>
