<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.4">EpoCanvas Docs 双模式搜索机制对比 (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="13">顶栏页内实时文本高亮查找 vs Ctrl+K 全站 Pagefind WASM 静态检索</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">模式一</text>
      <text x="92" y="17" fill="#f8fafc" font-size="16" font-weight="700">顶栏页内查找 (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">定位当前文章内部的段落、代码行与参数</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">直接在顶栏输入框键入关键词</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">点击顶栏搜索框即可输入，无需按下任何组合快捷键</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">DOM 文本节点实时遍历与包裹</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">脚本深度遍历当前文章 DOM，为匹配文字注入 &lt;mark&gt; 高亮底色</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">匹配计数实时反馈 (如 3 / 9 处)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">搜索框右侧实时显示当前序号与总匹配数，随时掌控浏览进度</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">键盘快捷跳转与顺滑滚动</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">按 Enter 跳至下一处，Shift+Enter 回到上一处，正文平滑居中</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Esc 一键清除恢复整洁原状</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">按 Esc 或点击清除按钮，瞬间移除全部 &lt;mark&gt; 标记，无任何残留</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="11">特点：纯前端 DOM 操作 · 零网络请求 · 随输随显 · 毫秒级响应</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">模式二</text>
      <text x="92" y="17" fill="#f8fafc" font-size="16" font-weight="700">全站检索弹窗 (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">跨全站所有文章、小节、代码块与配置进行全局检索</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">按下快捷键 Ctrl+K / Cmd+K 唤起</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">屏幕中央弹出全局对话框，自动聚焦输入框并挂载半透明遮罩</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">按需拉取轻量静态索引分片</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">仅加载 pagefind.wasm 运行时与对应字符的索引分片（几 KB 到几十 KB）</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">浏览器内存倒排索引权重计算</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">本地完成相关度打分与排序，标题命中优先展示，避免网络延迟</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">按文档分组与上下文片段预览</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">清晰呈现所属文章标题、小节路径与上下文摘要，关键字高亮</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">纯键盘导航直达目标段落</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">方向键上下移动焦点，Enter 直达目标文章并精准平滑跳转到锚点</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="11">特点：静态反向索引 · 按需下载 · 跨文档全文覆盖 · 内网部署可用</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ 本地化与隐私保障</text>
    <text x="160" y="28" fill="#94a3b8" font-size="11">两种搜索均完全在读者浏览器本地执行，不需要配置任何外部云端服务或爬虫密钥（如 Algolia），即使部署在无法访问外网的公司内网中也能顺畅检索。</text>
  </g>
</svg>
