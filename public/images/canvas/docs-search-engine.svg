<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="search-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="sshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="#090d16" />

  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="700">Pagefind 静态全文检索流水线 (Zero-Server Search Pipeline)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Build-Time Inverted Index Fragmentation · WebAssembly Query Evaluation · Client Modal</text>

  <!-- Step 1: Build & Content Scan -->
  <g transform="translate(40, 110)" filter="url(#sshadow)">
    <rect width="200" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect width="200" height="36" rx="10" fill="#1e293b" />
    <text x="15" y="24" fill="#f59e0b" font-size="12" font-weight="700">1. 构建期静态提取</text>

    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="600">Astro 静态 HTML</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">dist/ 目录下全部静态页面</text>

    <text x="15" y="120" fill="#f8fafc" font-size="12" font-weight="600">选择器精准定位</text>
    <text x="15" y="140" fill="#94a3b8" font-size="10">只索引 main 区域正文</text>
    <text x="15" y="155" fill="#94a3b8" font-size="10">自动排除 Header 与 Sidebar</text>

    <text x="15" y="190" fill="#f8fafc" font-size="12" font-weight="600">多语言分词解析</text>
    <text x="15" y="210" fill="#94a3b8" font-size="10">CJK 中文多字词切分</text>
    <text x="15" y="225" fill="#94a3b8" font-size="10">英文词根与符号分词</text>

    <rect x="12" y="250" width="176" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="275" fill="#fbbf24" font-size="10" font-family="monospace">pagefind --site dist</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 250 260 L 290 260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="290,256 298,260 290,264" fill="#f59e0b" />

  <!-- Step 2: Index Chunks & WASM -->
  <g transform="translate(300, 110)" filter="url(#sshadow)">
    <rect width="200" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect width="200" height="36" rx="10" fill="#1e293b" />
    <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">2. 分块压缩反向索引</text>

    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="600">WebAssembly 内核</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">pagefind.wasm (~100KB)</text>

    <text x="15" y="120" fill="#f8fafc" font-size="12" font-weight="600">分片倒排索引库</text>
    <text x="15" y="140" fill="#94a3b8" font-size="10">fragment/*.pf_fragment</text>
    <text x="15" y="155" fill="#94a3b8" font-size="10">按字母与词频切片存储</text>

    <text x="15" y="190" fill="#f8fafc" font-size="12" font-weight="600">按需惰性加载</text>
    <text x="15" y="210" fill="#94a3b8" font-size="10">仅在用户键入时下载</text>
    <text x="15" y="225" fill="#94a3b8" font-size="10">对应前缀分片 (几 KB)</text>

    <rect x="12" y="250" width="176" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="275" fill="#38bdf8" font-size="10" font-family="monospace">dist/pagefind/*</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 510 260 L 550 260" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="550,256 558,260 550,264" fill="#38bdf8" />

  <!-- Step 3: Client Modal & Keyboard -->
  <g transform="translate(560, 110)" filter="url(#sshadow)">
    <rect width="360" height="310" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <rect width="360" height="36" rx="10" fill="#064e3b" />
    <text x="15" y="24" fill="#34d399" font-size="12" font-weight="700">3. 客户端交互与模态展现 (Search.astro)</text>

    <!-- Search Modal Mock -->
    <g transform="translate(20, 50)">
      <rect width="320" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="15" y="25" fill="#60a5fa" font-size="12">🔎 "组件覆写"</text>
      <rect x="260" y="8" width="45" height="22" rx="4" fill="#0f172a" />
      <text x="268" y="23" fill="#94a3b8" font-size="10">ESC</text>

      <!-- Search Results List -->
      <g transform="translate(0, 50)">
        <rect width="320" height="56" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8" />
        <text x="12" y="20" fill="#f8fafc" font-size="12" font-weight="600">Starlight 组件覆写体系</text>
        <text x="12" y="38" fill="#94a3b8" font-size="10">通过 astro.config.mjs 中的 components 字段...</text>
        <text x="270" y="20" fill="#10b981" font-size="10">98% 匹配</text>
      </g>

      <g transform="translate(0, 115)">
        <rect width="320" height="56" rx="6" fill="#1e293b" />
        <text x="12" y="20" fill="#f8fafc" font-size="12" font-weight="600">Header.astro 定制开发</text>
        <text x="12" y="38" fill="#94a3b8" font-size="10">自定义 Header 组件支持多语言与动态导航徽标...</text>
        <text x="270" y="20" fill="#38bdf8" font-size="10">89% 匹配</text>
      </g>

      <!-- Footer Info -->
      <rect x="0" y="180" width="320" height="24" rx="4" fill="#0c1222" />
      <text x="10" y="196" fill="#64748b" font-size="10">↑↓ 导航 · Enter 选择 · ESC 退出 · 0 毫秒首字节渲染</text>
    </g>
  </g>
</svg>
