<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="rp-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="rp-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="520" fill="#090d16" />

  <!-- Title & Description Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="21.2" font-weight="700" letter-spacing="-0.4">EpoCanvas Docs Render Pipeline (Build &amp; Rendering Pipeline)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="9.8">Five-step build lifecycle from Markdown sources to static HTML and the Pagefind index</text>
  </g>

  <!-- Stage 1: Content Collection & Validation -->
  <g transform="translate(30, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-sky)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#0284c7" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="50" y="34" fill="#38bdf8" font-size="8.06" font-weight="700">Content collection &amp; validation</text>
    <text x="50" y="48" fill="#64748b" font-size="10">Content Scan</text>

    <!-- Content Items -->
    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="7" font-weight="600">Source scan entry</text>
    <text x="22" y="100" fill="#94a3b8" font-size="10">src/content/docs/</text>
    <text x="22" y="112" fill="#64748b" font-size="6.8">*.md and *.mdx indexing</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="7.8" font-weight="600">Frontmatter validation</text>
    <text x="22" y="160" fill="#38bdf8" font-size="6.6">title required check</text>
    <text x="22" y="174" fill="#94a3b8" font-size="5.7">description summary extraction</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#38bdf8" font-size="6.82" font-weight="600">Fail-fast protection</text>
    <text x="22" y="230" fill="#94a3b8" font-size="5.58">Build stops when title is missing</text>
    <text x="22" y="244" fill="#ef4444" font-size="7.4">Raises InvalidInputError</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Keeps untitled docs from going live</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 212 265 L 230 265" stroke="#38bdf8" stroke-width="2" />
  <polygon points="230,261 238,265 230,269" fill="#38bdf8" />

  <!-- Stage 2: Markdown & GFM Compilation -->
  <g transform="translate(236, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-blue)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#2563eb" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="50" y="34" fill="#60a5fa" font-size="8.2" font-weight="700">Markdown compilation</text>
    <text x="50" y="48" fill="#64748b" font-size="10">GFM AST Parse</text>

    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">GFM extended syntax conversion</text>
    <text x="22" y="100" fill="#94a3b8" font-size="6.6">Tables / task lists / footnotes</text>
    <text x="22" y="112" fill="#64748b" font-size="5.58">Converted to standard semantic HTML</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="6.82" font-weight="600">Rehype table optimization</text>
    <text x="22" y="160" fill="#60a5fa" font-size="10">rehypeWrapTables</text>
    <text x="22" y="174" fill="#94a3b8" font-size="8">Auto-wraps .table-wrapper</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#2563eb" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#60a5fa" font-size="11" font-weight="600">Asides</text>
    <text x="22" y="230" fill="#94a3b8" font-size="9">:::note / tip / caution</text>
    <text x="22" y="244" fill="#94a3b8" font-size="7.1">:::danger colored asides</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Injects matching icon and status color</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 418 265 L 436 265" stroke="#60a5fa" stroke-width="2" />
  <polygon points="436,261 444,265 436,269" fill="#60a5fa" />

  <!-- Stage 3: Code Highlighting -->
  <g transform="translate(442, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-violet)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#7c3aed" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="50" y="34" fill="#a78bfa" font-size="8.06" font-weight="700">Code block highlighting</text>
    <text x="50" y="48" fill="#64748b" font-size="10">Expressive Code</text>

    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="8.8" font-weight="600">Shiki syntax coloring</text>
    <text x="22" y="100" fill="#94a3b8" font-size="6.2">High-fidelity lexing for many languages</text>
    <text x="22" y="112" fill="#64748b" font-size="5.58">Adapts to both theme palettes</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="6.82" font-weight="600">Advanced annotations</text>
    <text x="22" y="160" fill="#a78bfa" font-size="8.1">title="..." filename label</text>
    <text x="22" y="174" fill="#94a3b8" font-size="5.9">{2-4} line background highlight</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#a78bfa" font-size="6.82" font-weight="600">Interactive diff enhancements</text>
    <text x="22" y="230" fill="#94a3b8" font-size="7.7">```diff change markers</text>
    <text x="22" y="244" fill="#94a3b8" font-size="7">One-click copy button</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">No third-party highlighter needed</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 624 265 L 642 265" stroke="#a78bfa" stroke-width="2" />
  <polygon points="642,261 650,265 642,269" fill="#a78bfa" />

  <!-- Stage 4: Layout & Component Overrides -->
  <g transform="translate(648, 115)" filter="url(#rp-shadow)">
    <rect width="176" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="176" height="6" rx="3" fill="url(#grad-amber)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#d97706" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="50" y="34" fill="#fbbf24" font-size="8.06" font-weight="700">Custom layout assembly</text>
    <text x="50" y="48" fill="#64748b" font-size="10">Starlight Overrides</text>

    <rect x="14" y="66" width="148" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">7 custom components injected</text>
    <text x="22" y="100" fill="#fbbf24" font-size="10">Header / Sidebar / TOC</text>
    <text x="22" y="112" fill="#64748b" font-size="8.1">TwoColumn / Search etc.</text>

    <rect x="14" y="126" width="148" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="22" y="144" fill="#e2e8f0" font-size="6.82" font-weight="600">Metadata &amp; timestamps</text>
    <text x="22" y="160" fill="#94a3b8" font-size="6.3">PageTitle renders the title</text>
    <text x="22" y="174" fill="#94a3b8" font-size="5.8">Reads the real last Git commit</text>

    <rect x="14" y="196" width="148" height="88" rx="6" fill="#0b0f19" stroke="#d97706" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="22" y="214" fill="#fbbf24" font-size="8.2" font-weight="600">TOC &amp; pager cards</text>
    <text x="22" y="230" fill="#94a3b8" font-size="5.7">Auto-extracts ##/### into the TOC</text>
    <text x="22" y="244" fill="#94a3b8" font-size="6.3">Pagination diagonal-arrow cards</text>
    <text x="22" y="268" fill="#64748b" font-size="5.58">Sidebar remembers scroll position</text>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <path d="M 830 265 L 848 265" stroke="#fbbf24" stroke-width="2" />
  <polygon points="848,261 856,265 848,269" fill="#fbbf24" />

  <!-- Stage 5: Static Output & Pagefind -->
  <g transform="translate(854, 115)" filter="url(#rp-shadow)">
    <rect width="136" height="300" rx="10" fill="url(#rp-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="136" height="6" rx="3" fill="url(#grad-emerald)" />
    
    <!-- Step Badge -->
    <circle cx="28" cy="36" r="14" fill="#059669" />
    <text x="28" y="41" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="48" y="34" fill="#34d399" font-size="7.4399999999999995" font-weight="700">Static output &amp; indexing</text>
    <text x="48" y="48" fill="#64748b" font-size="10">Pagefind &amp; Dist</text>

    <rect x="12" y="66" width="112" height="52" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="84" fill="#e2e8f0" font-size="6.82" font-weight="600">Pure static output</text>
    <text x="18" y="100" fill="#34d399" font-size="6.4">dist/ directory</text>
    <text x="18" y="112" fill="#64748b" font-size="7.2">Plain HTML + CSS</text>

    <rect x="12" y="126" width="112" height="62" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="144" fill="#e2e8f0" font-size="9.9" font-weight="600">Pagefind index</text>
    <text x="18" y="160" fill="#34d399" font-size="10">pagefind.wasm</text>
    <text x="18" y="174" fill="#94a3b8" font-size="5.58">Chunked compressed dictionaries</text>

    <rect x="12" y="196" width="112" height="88" rx="6" fill="#0b0f19" stroke="#059669" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="18" y="214" fill="#34d399" font-size="8" font-weight="600">Edge-ready</text>
    <text x="18" y="230" fill="#94a3b8" font-size="5.8">sitemap generation</text>
    <text x="18" y="244" fill="#94a3b8" font-size="5.58">Wrangler direct upload</text>
    <text x="18" y="268" fill="#64748b" font-size="5.58">Deployable to any static host</text>
  </g>

  <!-- Bottom Summary Info Pill -->
  <g transform="translate(30, 435)">
    <rect width="960" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="26" cy="26" r="8" fill="#38bdf8" fill-opacity="0.2" />
    <text x="26" y="30" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">i</text>
    <text x="46" y="23" fill="#f8fafc" font-size="8.7" font-weight="600">Pipeline summary</text>
    <text x="46" y="39" fill="#94a3b8" font-size="6.9">All compilation, highlighting and indexing happen at build time. No server-side compute online, zero client framework load, fast first paint, intranet-ready.</text>
  </g>
</svg>
