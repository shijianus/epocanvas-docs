<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.4">EpoCanvas Docs Dual-Mode Search (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="10.6">In-page header highlight search vs Ctrl+K site-wide Pagefind WASM search</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Mode 1</text>
      <text x="92" y="17" fill="#f8fafc" font-size="11.7" font-weight="700">In-page header search (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Locates paragraphs, code lines and params in the current article</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Type keywords straight into the header box</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.3">Click the header box and type — no shortcut needed</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Real-time DOM text-node traversal and wrapping</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.3">The script walks the article DOM and injects &lt;mark&gt; highlights</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.9" font-weight="600">Live match counter (e.g. 3 / 9)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.4">Current index and total shown beside the box, progress at a glance</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Keyboard jumps with smooth scrolling</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">Enter next, Shift+Enter previous, smooth-centered</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.1" font-weight="600">Esc clears everything at once</text>
        <text x="32" y="28" fill="#94a3b8" font-size="10">Esc or the clear button removes every &lt;mark&gt; instantly</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="8.8">Pure front-end DOM · zero requests · instant · millisecond response</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">Mode 2</text>
      <text x="92" y="17" fill="#f8fafc" font-size="12.1" font-weight="700">Global search dialog (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="7.1">Searches every article, section, code block and config site-wide</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Summoned with Ctrl+K / Cmd+K</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.2">Centered dialog with focused input and a dim backdrop</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Pulls light static index shards on demand</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.5">Loads only pagefind.wasm and the shards for your characters (KBs)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Inverted-index scoring in browser memory</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.9">Relevance scoring and ranking run locally; title hits rank first</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Grouped by document with context previews</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8">Shows article title, section path and snippet with highlights</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Full keyboard navigation to the target paragraph</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.5">Arrows move focus, Enter opens the article at the exact anchor</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="8.7">Static inverted index · on-demand download · site-wide · intranet-ready</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ Local-first</text>
    <text x="160" y="28" fill="#94a3b8" font-size="9.5">Both searches run entirely in the reader's browser — no external service or crawler key (e.g. Algolia) needed; works even on offline intranets.</text>
  </g>
</svg>
