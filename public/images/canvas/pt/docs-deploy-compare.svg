<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="14.9" font-weight="700" letter-spacing="-0.4">Opções de implantação no Cloudflare Pages</text>
    <text x="0" y="48" fill="#94a3b8" font-size="8.9">Upload local ou integração Git opcional: validação completa obrigatória</text>
  </g>

  <!-- Left Column: CLI Direct Deploy -->
  <g transform="translate(45, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-amber-orange)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
      <text x="45" y="15" fill="#fbbf24" font-size="6.82" font-weight="700" text-anchor="middle">Método 1 · recomendado</text>
      <text x="102" y="17" fill="#f8fafc" font-size="10.5" font-weight="700">Upload direto por CLI local (Wrangler CLI)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Os scripts verificam condições e validam antes do upload</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.7" font-weight="600">Um único comando local: pnpm run deploy</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.5">Exige main limpo e o mesmo commit de origin/main remoto</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.6" font-weight="600">O Astro 7 gera dist/ e índices de pesquisa em local</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.4">pnpm run verify: tipos, build, testes e conteúdo</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">O Wrangler lê as credenciais e envia para o Cloudflare Pages</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.5">Após as verificações, upload com credenciais Cloudflare válidas</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.6" font-weight="600">Após o upload, confirme o estado e o URL</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Confirme ramo e commit na consola, depois teste o domínio</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#d97706" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.4" font-weight="600">Pré-visualização: pnpm run deploy:preview</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.5">Após verify completo: pnpm run verify:preview</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#fbbf24" font-size="6.82">Primeira implantação, manutenção a solo e revisão; verificações obrigatórias</text>
  </g>

  <!-- Right Column: Git Webhook Deploy -->
  <g transform="translate(520, 110)" filter="url(#dc-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#dc-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-blue-cyan)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="90" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
      <text x="45" y="15" fill="#60a5fa" font-size="6.9" font-weight="700" text-anchor="middle">Método 2 · opcional</text>
      <text x="102" y="17" fill="#f8fafc" font-size="11" font-weight="700">Build automático por Git (Connect to Git)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Crie um projeto com integração Git e ligue o repositório</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.9" font-weight="600">Envie o ramo de produção (ex. main)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.3">Ative a implantação automática; GitHub CI só por si não publica</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="8.3" font-weight="600">O Pages obtém o ramo configurado</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Instale Node.js e pnpm conforme as definições do projeto</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Na nuvem: pnpm run verify</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.7">Primeiro instale: pnpm install --frozen-lockfile</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Os URL de pré-visualização dependem das definições</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">URL próprio apenas para ramos ou PR com pré-visualização ativa</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#2563eb" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Após validação e implantação bem-sucedidas, consulte os registos</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.9">Confirme estado, ramo, commit e domínio na consola</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#60a5fa" font-size="7.1">Equipas, implantação por ramo e pré-visualizações de PR configuráveis</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="18" fill="#10b981" font-size="7.4399999999999995" font-weight="700">Escolha o tipo de projeto ao criá-lo; ambas as vias exigem validação completa</text>
    <text x="20" y="35" fill="#94a3b8" font-size="6.82">Mudar de Direct Upload para Git exige outro projeto; o Wrangler também exige verificações. O diagrama não comprova uma implantação.</text>
  </g>
</svg>
