<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="19.3" font-weight="700" letter-spacing="-0.4">Pesquisa de modo duplo no EpoCanvas Docs (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="9.5">Realce na página pela barra superior vs pesquisa global Pagefind WASM com Ctrl+K</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Modo 1</text>
      <text x="92" y="17" fill="#f8fafc" font-size="9.92" font-weight="700">Pesquisa na página pela barra superior (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Localiza parágrafos, linhas de código e parâmetros do artigo atual</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Escreva palavras-chave na caixa da barra superior</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.5">Clique na caixa e escreva, sem atalhos de teclado</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Percurso e embrulho em tempo real dos nós de texto do DOM</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.2">O script percorre o DOM do artigo e injeta &lt;mark&gt; nas correspondências</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Contador de correspondências ao vivo (p. ex. 3 / 9)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.3">À direita da caixa veem-se o índice atual e o total, progresso sempre visível</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Saltos por teclado com deslocação suave</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.6">Enter avança, Shift+Enter recua, o parágrafo centra suavemente</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="10.6" font-weight="600">Esc limpa tudo de uma vez</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.2">Com Esc ou o botão de limpar desaparecem todos os &lt;mark&gt; sem rasto</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="6.82">Front-end puro sobre o DOM · zero pedidos · resultado imediato · resposta em milissegundos</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">Modo 2</text>
      <text x="92" y="17" fill="#f8fafc" font-size="10.7" font-weight="700">Janela de pesquisa global (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Pesquisa em todos os artigos, secções, blocos de código e configuração</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Abre com Ctrl+K / Cmd+K</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.3">Diálogo centrado com foco automático e véu semitransparente</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Obtém fragmentos leves de índice à medida que são precisos</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.5">Carrega apenas o pagefind.wasm e os fragmentos dos caracteres escritos (alguns KB)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Pontuação do índice invertido na memória do navegador</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Relevância e ordenação calculadas em local; títulos correspondentes primeiro, sem latência</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Agrupado por documento com pré-visualização de contexto</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.2">Mostra artigo, caminho da secção e extrato, palavras-chave realçadas</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Navegação por teclado até ao parágrafo exato</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.1">As setas movem o foco; o Enter abre o artigo exatamente na âncora</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="7.2">Índice invertido estático · transferência a pedido · todo o site · válido em intranet</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ 100% local</text>
    <text x="160" y="28" fill="#94a3b8" font-size="7.3">As duas pesquisas executam-se por inteiro no navegador de quem lê: sem serviços externos nem chaves de rastreio (como Algolia), e funcionam mesmo numa intranet sem saída para a internet.</text>
  </g>
</svg>
