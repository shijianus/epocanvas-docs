<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%" fill="none">
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradWorker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gradStorage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left: Client Layer -->
  <g transform="translate(40, 50)">
    <rect width="200" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="200" height="42" rx="10" fill="#f1f5f9"/>
    <path d="M0 32 h200" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">💻 客户端与访问层</text>

    <!-- Client Cards -->
    <rect x="18" y="55" width="164" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Vue3 响应式 WebUI</text>
    <text x="32" y="100" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">Cloudflare Pages 静态托管</text>

    <rect x="18" y="125" width="164" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="150" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">移动适配 / PWA</text>
    <text x="32" y="170" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">全平台浏览器即开即用</text>

    <rect x="18" y="195" width="164" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="220" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">REST / OpenAPI</text>
    <text x="32" y="240" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">多租户与批量管理接口</text>
  </g>

  <!-- Connectors: Client -> Worker -->
  <path d="M 240 140 L 330 140" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="330,140 324,136 324,144" fill="#3b82f6"/>
  <path d="M 240 210 L 330 210" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="330,210 324,206 324,214" fill="#3b82f6"/>

  <!-- Center: Serverless Engine -->
  <g transform="translate(340, 50)">
    <rect width="240" height="280" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="240" height="42" rx="10" fill="#eff6ff"/>
    <path d="M0 32 h240" stroke="#bfdbfe" stroke-width="1"/>
    <text x="24" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">⚡ Cloudflare Workers 核心</text>

    <!-- Sub components -->
    <rect x="18" y="55" width="204" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="78" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Hono.js API 路由网关</text>
    <text x="32" y="93" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">JWT / Session / RBAC 鉴权</text>

    <rect x="18" y="112" width="204" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="135" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Cloudflare Email Routing</text>
    <text x="32" y="150" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">邮件事件监听与原生解析</text>

    <rect x="18" y="169" width="204" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="192" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Drizzle ORM 数据持久</text>
    <text x="32" y="207" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">高效类型安全 SQL 驱动</text>

    <rect x="18" y="226" width="204" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="249" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Workers AI 验证码提取</text>
    <text x="32" y="264" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">智能识别并高亮邮件验证码</text>
  </g>

  <!-- Connectors: Worker -> Storage -->
  <path d="M 580 120 L 650 120" stroke="#10b981" stroke-width="2"/>
  <polygon points="650,120 644,116 644,124" fill="#10b981"/>
  <path d="M 580 180 L 650 180" stroke="#10b981" stroke-width="2"/>
  <polygon points="650,180 644,176 644,184" fill="#10b981"/>
  <path d="M 580 240 L 650 240" stroke="#10b981" stroke-width="2"/>
  <polygon points="650,240 644,236 644,244" fill="#10b981"/>

  <!-- Right: Storage & External Services -->
  <g transform="translate(660, 50)">
    <rect width="180" height="280" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="180" height="42" rx="10" fill="#ecfdf5"/>
    <path d="M0 32 h180" stroke="#a7f3d0" stroke-width="1"/>
    <text x="18" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857">🗄️ 存储与外部服务</text>

    <!-- Storage items -->
    <rect x="14" y="55" width="152" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="77" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Cloudflare D1</text>
    <text x="24" y="93" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">Serverless SQLite 数据库</text>

    <rect x="14" y="112" width="152" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Cloudflare R2</text>
    <text x="24" y="150" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">零流出费用大文件存储</text>

    <rect x="14" y="169" width="152" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="191" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Resend SMTP API</text>
    <text x="24" y="207" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">高送达率外发邮件服务</text>

    <rect x="14" y="226" width="152" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="248" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Telegram Bot API</text>
    <text x="24" y="264" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#64748b">新邮件实时推送通知</text>
  </g>
</svg>
