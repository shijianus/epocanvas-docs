<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="sf-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-teal-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sf-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(45, 36)">
    <text x="0" y="24" fill="#f8fafc" font-size="19.9" font-weight="700" letter-spacing="-0.4">Recherche double mode d'EpoCanvas Docs (Dual-Mode Search Architecture)</text>
    <text x="0" y="48" fill="#94a3b8" font-size="9">Surlignage dans la page depuis l'en-tête vs recherche globale Pagefind WASM (Ctrl+K)</text>
  </g>

  <!-- Left Column: In-Page Search -->
  <g transform="translate(45, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-teal-blue)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.8" />
      <text x="40" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Mode 1</text>
      <text x="92" y="17" fill="#f8fafc" font-size="11.4" font-weight="700">Recherche dans la page (In-Page Search)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Repère paragraphes, lignes de code et paramètres de l'article courant</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Tapez les mots-clés dans le champ de l'en-tête</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.8">Cliquez sur le champ et tapez, sans raccourci clavier</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Parcours et enveloppage en direct des nœuds texte du DOM</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.9">Le script parcourt le DOM de l'article et injecte des &lt;mark&gt; sur les correspondances</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Compteur de correspondances en direct (ex. 3 / 9)</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.4">À droite du champ, l'index courant et le total, progression toujours visible</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Sauts clavier et défilement fluide</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.7">Entrée pour suivant, Maj+Entrée pour précédent, centrage doux</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#0284c7" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="9.8" font-weight="600">Échap efface tout d'un coup</text>
        <text x="32" y="28" fill="#94a3b8" font-size="9.3">Échap ou le bouton d'effacement retire tous les &lt;mark&gt; sans trace</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#0284c7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#38bdf8" font-size="7">DOM pur côté client · zéro requête · affichage instantané · réponse en millisecondes</text>
  </g>

  <!-- Right Column: Global Search -->
  <g transform="translate(520, 110)" filter="url(#sf-shadow)">
    <rect width="435" height="365" rx="10" fill="url(#sf-card)" stroke="#334155" stroke-width="1.2" />
    <rect width="435" height="6" rx="3" fill="url(#grad-purple-indigo)" />

    <!-- Mode Badge -->
    <g transform="translate(24, 22)">
      <rect width="80" height="22" rx="4" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="0.8" />
      <text x="40" y="15" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">Mode 2</text>
      <text x="92" y="17" fill="#f8fafc" font-size="10" font-weight="700">Fenêtre de recherche globale (Global Pagefind)</text>
      <text x="0" y="38" fill="#94a3b8" font-size="6.82">Cherche dans tous les articles, sections, blocs de code et configurations</text>
    </g>

    <!-- Steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Ouverte par Ctrl+K / Cmd+K</text>
        <text x="32" y="28" fill="#94a3b8" font-size="8.1">Boîte centrale avec champ focalisé et voile semi-transparent</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Tire des fragments d'index statiques à la demande</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.4">Charge seulement pagefind.wasm et les fragments des caractères saisis (quelques Ko)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Scoring de l'index inversé en mémoire navigateur</text>
        <text x="32" y="28" fill="#94a3b8" font-size="6.2">Pertinence et tri calculés en local ; les titres correspondent en premier, sans latence réseau</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Groupé par document avec extraits de contexte</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.4">Affiche article, chemin de section et extrait, mots-clés surlignés</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <circle cx="12" cy="14" r="10" fill="#7c3aed" />
        <text x="12" y="18" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="32" y="14" fill="#e2e8f0" font-size="7.4399999999999995" font-weight="600">Navigation clavier jusqu'au paragraphe exact</text>
        <text x="32" y="28" fill="#94a3b8" font-size="7.3">Les flèches déplacent le focus ; Entrée ouvre l'article à la bonne ancre</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="24" y="322" width="387" height="28" rx="6" fill="#0b0f19" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="36" y="340" fill="#a78bfa" font-size="6.82">Index inversé statique · téléchargement à la demande · tout le site · utilisable en intranet</text>
  </g>

  <!-- Bottom Common Info Banner -->
  <g transform="translate(45, 492)">
    <rect width="910" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="28" fill="#10b981" font-size="12" font-weight="700">✓ 100 % local</text>
    <text x="160" y="28" fill="#94a3b8" font-size="7">Les deux recherches s'exécutent entièrement dans le navigateur du lecteur : aucun service externe ni clé de crawler (type Algolia), et cela fonctionne même sur une intranet sans accès internet.</text>
  </g>
</svg>
