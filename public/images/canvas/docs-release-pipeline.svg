<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="rshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="#090d16" />

  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="700">自动化 CI/CD 与 Cloudflare 边缘分发流水线 (Release Pipeline)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Git Tag Trigger · GitHub Actions Automated Build · Cloudflare Pages Serverless Anycast CDN</text>

  <!-- Step 1: Git Push / Tag -->
  <g transform="translate(40, 110)" filter="url(#rshadow)">
    <rect width="180" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect width="180" height="36" rx="10" fill="#1e293b" />
    <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">1. 代码推送与打标</text>

    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="600">Git Commit &amp; Push</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">main 分支提交合并</text>

    <text x="15" y="120" fill="#f8fafc" font-size="12" font-weight="600">语义化版本 Tag</text>
    <text x="15" y="140" fill="#94a3b8" font-size="10">git tag v1.2.0</text>
    <text x="15" y="155" fill="#94a3b8" font-size="10">git push origin v1.2.0</text>

    <text x="15" y="190" fill="#f8fafc" font-size="12" font-weight="600">触发 Webhook</text>
    <text x="15" y="210" fill="#94a3b8" font-size="10">GitHub Actions 侦测到</text>
    <text x="15" y="225" fill="#94a3b8" font-size="10">tag: 'v*' 事件触发</text>

    <rect x="12" y="250" width="156" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="18" y="275" fill="#38bdf8" font-size="10" font-family="monospace">git push origin main</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 230 260 L 260 260" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="260,256 268,260 260,264" fill="#38bdf8" />

  <!-- Step 2: GitHub Actions Runner -->
  <g transform="translate(270, 110)" filter="url(#rshadow)">
    <rect width="200" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect width="200" height="36" rx="10" fill="#1e293b" />
    <text x="15" y="24" fill="#818cf8" font-size="12" font-weight="700">2. 自动化构建与质检</text>

    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="600">Node.js 20 容器</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">pnpm install 缓存还原</text>

    <text x="15" y="120" fill="#f8fafc" font-size="12" font-weight="600">Astro 静态构建</text>
    <text x="15" y="140" fill="#94a3b8" font-size="10">astro build 生成静态站点</text>
    <text x="15" y="155" fill="#94a3b8" font-size="10">Sharp 优化全部静态图片</text>

    <text x="15" y="190" fill="#f8fafc" font-size="12" font-weight="600">Pagefind 索引创建</text>
    <text x="15" y="210" fill="#94a3b8" font-size="10">自动生成 WASM 索引文件</text>

    <rect x="12" y="250" width="176" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="275" fill="#a5b4fc" font-size="10" font-family="monospace">pnpm run build OK</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 480 260 L 510 260" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="510,256 518,260 510,264" fill="#818cf8" />

  <!-- Step 3: Cloudflare Pages Deployment -->
  <g transform="translate(520, 110)" filter="url(#rshadow)">
    <rect width="200" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect width="200" height="36" rx="10" fill="#1e293b" />
    <text x="15" y="24" fill="#f97316" font-size="12" font-weight="700">3. Wrangler 边缘部署</text>

    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="600">Pages 极速上传</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">wrangler pages deploy dist</text>
    <text x="15" y="100" fill="#94a3b8" font-size="10">差量哈希同步，10 秒内完成</text>

    <text x="15" y="135" fill="#f8fafc" font-size="12" font-weight="600">多节点边缘分发</text>
    <text x="15" y="155" fill="#94a3b8" font-size="10">全球 300+ 边缘机房同步</text>

    <text x="15" y="190" fill="#f8fafc" font-size="12" font-weight="600">发布状态变更</text>
    <text x="15" y="210" fill="#94a3b8" font-size="10">绑定 main 分支生产部署</text>

    <rect x="12" y="250" width="176" height="40" rx="6" fill="#1e293b" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="275" fill="#fdba74" font-size="10" font-family="monospace">wrangler deploy OK</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 730 260 L 760 260" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="760,256 768,260 760,264" fill="#f97316" />

  <!-- Step 4: Live Verification -->
  <g transform="translate(770, 110)" filter="url(#rshadow)">
    <rect width="150" height="310" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <rect width="150" height="36" rx="10" fill="#064e3b" />
    <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">4. 生产环境生效</text>

    <text x="12" y="65" fill="#f8fafc" font-size="11" font-weight="600">Pages 官方域</text>
    <text x="12" y="85" fill="#94a3b8" font-size="9">epocanvas-docs</text>
    <text x="12" y="100" fill="#38bdf8" font-size="9">.pages.dev</text>

    <text x="12" y="130" fill="#f8fafc" font-size="11" font-weight="600">自定义独立域</text>
    <text x="12" y="150" fill="#38bdf8" font-size="9">docs.epocanvas.com</text>

    <text x="12" y="180" fill="#f8fafc" font-size="11" font-weight="600">安全与加速</text>
    <text x="12" y="200" fill="#94a3b8" font-size="9">Cloudflare SSL</text>
    <text x="12" y="215" fill="#94a3b8" font-size="9">HTTP/2 &amp; HTTP/3</text>

    <rect x="10" y="250" width="130" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="18" y="275" fill="#34d399" font-size="11" font-weight="700">HTTP 200 OK</text>
  </g>
</svg>
